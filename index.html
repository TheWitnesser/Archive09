<script>
function $(id){ return document.getElementById(id); }

function show(id){
  document.querySelectorAll("section").forEach(s => s.classList.add("hidden"));
  $(id).classList.remove("hidden");
  window.scrollTo(0, 0);
}

function norm(s){
  return s.toLowerCase()
    .replace(/[^a-z0-9,\/ -]/g, "")
    .replace(/\s+/g, " ")
    .trim();
}

// Utility function to compute SHA-256 string hash using standard Web Crypto API
async function sha256(str) {
  const buf = await crypto.subtle.digest(
    "SHA-256",
    new TextEncoder().encode(str)
  );

  return Array.from(new Uint8Array(buf))
    .map(b => b.toString(16).padStart(2, '0'))
    .join('');
}

async function check1(){
  const v = norm($("a1").value);
  const hash = await sha256(v);

  // Hashes for:
  // "the one inside the cord"
  // "the one inside"
  const validHashes = [
    "e622b781cf267104719bb81062025ed9f335503ddcdbd1dfbb2541db0d12fefc",
    "95c91104e1e3dd2d103ea29e34a6dfdf2d9aa5237ed78be1577dcd2b0d2a8b9e"
  ];

  if (validHashes.includes(hash)) {
    show("p2");
  } else {
    $("e1").textContent = "No. Something is still out of place.";
  }
}

async function check2(){
  const v = norm($("a2").value);
  const hash = await sha256(v);

  // Hashes for:
  // "ninth"
  // "the ninth"
  // "the ninth witness"
  const validHashes = [
    "357f892fb68f946e917d84871d34e6f4234efd22964a092822ff9b1062c31154",
    "c5e937d589886470fb4a72d4ce5e7b23393961bbecce9df713f019a16f5c5dc0",
    "53d537a4e6727218684724a2592dae4efc3f15d966d6ed9a11dbba80509a2b66"
  ];

  if (validHashes.includes(hash)) {
    show("p3");
  } else {
    $("e2").textContent = "Eight were counted. Look at what wasn't.";
  }
}

async function check3(){
  const v = norm($("a3").value).replace(/\s+/g, "");
  const hash = await sha256(v);

  // Hashes for:
  // "74237-1286"
  // "742,37,-1286"
  // "742/37/-1286"
  const validHashes = [
    "3d6f125a0a3a78f877fca99bb710376ce93821a812df0f65839b2cf41e6c3fa1",
    "5d1e4ca52a4cd9a96e98b0a996bbef58a23072efd0246a47ce4e46db874ef72d",
    "f29bfdca6b406e1ce021ab50b86aef15fb45a8df2d854ce6fa2aa8f921bcbc12"
  ];

  if (validHashes.includes(hash)) {
    show("final");
  } else {
    $("e3").textContent = "Three lines. Three numbers. Try again.";
  }
}
</script>
